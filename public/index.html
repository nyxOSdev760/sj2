<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#e9e7f6" />
		<script>
			// Apply the saved theme before first paint so there's no flash.
			try {
				if (localStorage.getItem("sj2:theme") === "dark") document.documentElement.dataset.theme = "dark";
			} catch {}
		</script>
		<title>Skyline</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="fonts/outfit-600.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="style.css" />
		<script src="config.js"></script>
		<script src="adblock.js"></script>
		<script src="wisp.js"></script>
		<script src="home.js"></script>
		<script src="tour.js"></script>
		<script src="ai.js"></script>
		<script src="app.js" defer></script>
	</head>
	<body>
		<nav id="tabbar">
			<div id="tabs" role="tablist" aria-label="Tabs"></div>
			<button id="add-tab" class="icon" title="New tab" aria-label="New tab">
				<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
			</button>
		</nav>

		<header id="toolbar">
			<button id="back" class="icon" title="Back" aria-label="Back">
				<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
			</button>
			<button id="forward" class="icon" title="Forward" aria-label="Forward">
				<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
			</button>
			<button id="reload" class="icon" title="Reload" aria-label="Reload">
				<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
			</button>
			<button id="home" class="icon" title="Home" aria-label="Home">
				<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10" /></svg>
			</button>
			<form id="bar-form" class="bar">
				<svg id="bar-icon" class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10" /></svg>
				<input id="bar" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL" aria-label="Address" />
			</form>
			<button id="ai-button" class="icon" title="Skyline AI" aria-label="Skyline AI">
				<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" /></svg>
			</button>
			<div class="menu-wrap">
				<button id="menu-button" class="icon" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
					<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
				</button>
				<div id="menu" class="menu" role="menu" aria-label="Menu" hidden>
					<button type="button" role="menuitem" data-action="ai">
						<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" /></svg>
						Ask AI
					</button>
					<button type="button" role="menuitem" data-action="history">
						<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3" /></svg>
						History
					</button>
					<button type="button" role="menuitem" data-action="bookmark">
						<svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z" /></svg>
						Bookmark this page
					</button>
					<hr />
					<button type="button" role="menuitem" data-action="tour">
						<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z" /></svg>
						Take the tour
					</button>
				</div>
			</div>
			<button id="show-settings" class="icon" title="Settings" aria-label="Settings">
				<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
			</button>
		</header>

		<main id="home-screen">
			<canvas id="stars" class="stars" aria-hidden="true"></canvas>
			<h1 class="logo"><span>Skyline</span></h1>
			<form id="search-form" class="search">
				<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
				<input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL" aria-label="Search or enter a URL" autofocus />
				<button class="search-go" type="submit" title="Go" aria-label="Go">
					<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
				</button>
			</form>
			<p id="status" class="status" role="status">Starting proxy…</p>
			<nav id="shortcuts" class="shortcuts" aria-label="Shortcuts"></nav>
		</main>

		<div id="frames"></div>

		<aside id="ai-panel" class="ai-panel" aria-labelledby="ai-title" hidden>
			<header class="ai-head">
				<svg class="ai-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" /></svg>
				<h2 id="ai-title">Skyline AI</h2>
				<span id="ai-quota" class="ai-quota"></span>
				<button id="ai-new" class="icon" type="button" title="New chat" aria-label="New chat">
					<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
				</button>
				<button id="ai-close" class="icon" type="button" title="Close" aria-label="Close">
					<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
				</button>
			</header>
			<div id="ai-log" class="ai-log" aria-live="polite"></div>
			<form id="ai-form" class="ai-form">
				<textarea id="ai-input" rows="1" maxlength="4000" placeholder="Ask anything…" aria-label="Message Skyline AI"></textarea>
				<button class="search-go" type="submit" title="Send" aria-label="Send">
					<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
				</button>
			</form>
			<p class="ai-note">AI can be wrong. Don't share private info.</p>
		</aside>

		<dialog id="settings-panel" class="panel" aria-labelledby="settings-title">
			<header class="panel-head">
				<h2 id="settings-title">Settings</h2>
				<button id="settings-close" class="icon" type="button" title="Close" aria-label="Close">
					<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
				</button>
			</header>
			<div class="settings">
				<label>
					Theme
					<select id="theme">
						<option value="lavender">Lavender</option>
						<option value="dark">AMOLED dark</option>
					</select>
				</label>
				<label>
					Wallpaper
					<select id="wallpaper">
						<option value="gtr-sunset">GT-R sunset</option>
						<option value="r34-night">Night drive</option>
						<option value="maybach-night">Maybach night</option>
						<option value="maybach-driveway">Maybach driveway</option>
						<option value="snow">Snow (animated)</option>
						<option value="night">Night sky (animated)</option>
					</select>
				</label>
				<label>
					Transport
					<select id="transport">
						<option value="libcurl">libcurl</option>
						<option value="epoxy">epoxy</option>
					</select>
				</label>
				<label>
					Wisp server
					<input id="wisp" type="text" autocomplete="off" spellcheck="false" />
				</label>
				<label>
					Save history
					<input id="save-history" type="checkbox" />
				</label>
				<label>
					Search engine
					<select id="engine">
						<option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
						<option value="https://www.google.com/search?q=%s">Google</option>
						<option value="https://www.bing.com/search?q=%s">Bing</option>
						<option value="https://search.brave.com/search?q=%s">Brave</option>
					</select>
				</label>
				<label>
					Home shortcuts
					<button id="reset-shortcuts" class="text-button" type="button">Reset to defaults</button>
				</label>
				<p id="settings-status" class="status" role="status"></p>
			</div>
		</dialog>

		<dialog id="shortcut-panel" class="panel" aria-labelledby="shortcut-title">
			<form id="shortcut-form" method="dialog">
				<header class="panel-head">
					<h2 id="shortcut-title">Add shortcut</h2>
					<button id="shortcut-close" class="icon" type="button" title="Close" aria-label="Close">
						<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
					</button>
				</header>
				<div class="settings">
					<label>
						Name
						<input id="shortcut-name" type="text" autocomplete="off" maxlength="40" placeholder="Optional" />
					</label>
					<label>
						URL
						<input id="shortcut-url" type="text" autocomplete="off" spellcheck="false" placeholder="example.com" required />
					</label>
					<p id="shortcut-error" class="status error" role="alert"></p>
					<div class="panel-actions">
						<button id="shortcut-cancel" class="text-button" type="button">Cancel</button>
						<button class="text-button primary" type="submit">Add</button>
					</div>
				</div>
			</form>
		</dialog>

		<dialog id="history-panel" class="panel" aria-labelledby="history-title">
			<header class="panel-head history-head">
				<h2 id="history-title">History</h2>
				<input id="history-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search history" aria-label="Search history" />
				<button id="history-clear" class="text-button" type="button">Clear all</button>
				<button id="history-close" class="icon" type="button" title="Close" aria-label="Close">
					<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
				</button>
			</header>
			<div id="history-list"></div>
		</dialog>
	</body>
</html>
