<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#120d1d" />
		<title>WX</title>
		<link id="favicon" rel="icon" href="favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="stylesheet" href="style.css" />
		<script>
			// Auto about:blank: reopen this site inside a new about:blank tab (so its address and
			// history don't show the site) and send this tab to Google. Skipped when already
			// running inside that tab's frame, or when turned off in Settings. If the popup is
			// blocked, wx.js shows a button to open it with a click instead.
			(function () {
				var off = false;
				try {
					if (window.top !== window.self) return;
					off = localStorage.getItem("wx:autoBlank") === "false";
				} catch (e) {}
				if (off) return;
				window.wxOpenBlank = function () {
					var w = window.open("about:blank", "_blank");
					if (!w || w.closed) return false;
					var d = w.document;
					d.title = document.title;
					var icon = d.createElement("link");
					icon.rel = "icon";
					icon.href = new URL("favicon.png", location.href).href;
					d.head.appendChild(icon);
					d.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#120d1d";
					var f = d.createElement("iframe");
					f.src = location.href;
					f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
					f.allow = "fullscreen; autoplay; gamepad; clipboard-write; pointer-lock";
					d.body.appendChild(f);
					location.replace("https://www.google.com");
					return true;
				};
				if (!window.wxOpenBlank()) window.wxBlankBlocked = true;
			})();
		</script>
		<script src="ugs-files.js" defer></script>
		<script src="gn-files.js" defer></script>
		<script src="wx.js" defer></script>
	</head>
	<body>
		<nav class="side" aria-label="Sections">
			<a class="side-logo" href="./" title="WX"><img src="apple-touch-icon.png" alt="WX" /></a>
			<button class="side-btn active" type="button" data-view="all" title="Games" aria-label="Games">
				<svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-3.96 3.43l-.9 6.32a2.5 2.5 0 0 0 4.5 1.85L8 15h8l1.66 1.6a2.5 2.5 0 0 0 4.5-1.85l-.9-6.32A4 4 0 0 0 17.3 5z" /></svg>
			</button>
			<button class="side-btn" type="button" data-view="favorites" title="Favorites" aria-label="Favorites">
				<svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z" /></svg>
			</button>
			<button class="side-btn" type="button" data-view="recent" title="Recently played" aria-label="Recently played">
				<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3" /></svg>
			</button>
			<button class="side-btn side-btn-bottom" type="button" data-view="settings" title="Settings" aria-label="Settings">
				<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
			</button>
		</nav>

		<div class="main">
			<header class="top">
				<h1 id="title" class="title">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-3.96 3.43l-.9 6.32a2.5 2.5 0 0 0 4.5 1.85L8 15h8l1.66 1.6a2.5 2.5 0 0 0 4.5-1.85l-.9-6.32A4 4 0 0 0 17.3 5z" /></svg>
					<span id="title-text">Games</span>
				</h1>
				<input id="search" class="search" type="search" placeholder="Search…" aria-label="Search games" autocomplete="off" spellcheck="false" />
			</header>

			<div class="chips" role="tablist" aria-label="Collections">
				<button class="chip active" type="button" role="tab" data-source="all">All <span class="chip-n"></span></button>
				<button class="chip" type="button" role="tab" data-source="gn">Gn-Math <span class="chip-n"></span></button>
				<button class="chip" type="button" role="tab" data-source="ugs">UGS <span class="chip-n"></span></button>
			</div>

			<main id="grid" class="grid" aria-label="Games"></main>
			<p id="empty" class="empty" hidden></p>

			<section id="settings" class="settings" hidden aria-label="Settings">
				<p class="group-label">Cloaking</p>
				<div class="setting">
					<h2>Tab cloak</h2>
					<div id="cloak-dd" class="dropdown">
						<button id="cloak-dd-btn" class="dd-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
							<img class="dd-icon" alt="" width="22" height="22" />
							<span class="dd-label"></span>
							<svg class="dd-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
						</button>
						<ul id="cloak-dd-menu" class="dd-menu" role="listbox" hidden></ul>
					</div>
				</div>
				<div class="setting setting-row">
					<h2>Auto about:blank</h2>
					<button id="auto-blank" class="switch" type="button" role="switch" aria-checked="true" aria-label="Auto about:blank"><span></span></button>
				</div>
				<div class="setting">
					<h2>Panic key</h2>
					<div class="setting-control">
						<button id="panic-key" class="key-field" type="button">Not set</button>
						<button id="panic-clear" class="text-btn" type="button" hidden>Clear</button>
					</div>
				</div>
				<div class="setting">
					<h2>Panic site</h2>
					<input id="panic-url" class="text-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://clever.com/login" />
				</div>
			</section>
		</div>

		<div id="blank-prompt" class="blank-prompt" hidden>
			<div class="blank-card">
				<h2>Open in about:blank</h2>
				<button id="blank-open" class="blank-btn" type="button">Open</button>
				<button id="blank-stay" class="text-btn" type="button">Stay here</button>
			</div>
		</div>

		<div id="cloak" class="cloak" hidden>
			<iframe id="cloak-frame" title="Clever"></iframe>
		</div>
	</body>
</html>
