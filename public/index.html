<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Saint Vicious</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="fonts/fruktur.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="style.css" />
		<script src="config.js"></script>
		<script src="adblock.js"></script>
		<script src="app.js" defer></script>
	</head>
	<body>
		<nav id="tabbar">
			<div id="tabs" role="tablist" aria-label="Tabs"></div>
			<button id="add-tab" class="icon" title="New tab" aria-label="New tab">
				<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
			</button>
		</nav>

		<header id="toolbar">
			<button id="back" class="icon" title="Back" aria-label="Back">
				<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
			</button>
			<button id="forward" class="icon" title="Forward" aria-label="Forward">
				<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
			</button>
			<button id="reload" class="icon" title="Reload" aria-label="Reload">
				<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
			</button>
			<button id="home" class="icon" title="Home" aria-label="Home">
				<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10" /></svg>
			</button>
			<form id="bar-form" class="bar">
				<input id="bar" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL" aria-label="Address" />
			</form>
			<button id="show-history" class="icon" title="History" aria-label="History">
				<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3" /></svg>
			</button>
			<button id="external" class="icon" title="Open the real site outside the proxy" aria-label="Open the real site outside the proxy">
				<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" /></svg>
			</button>
			<button id="show-settings" class="icon" title="Settings" aria-label="Settings">
				<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
			</button>
		</header>

		<main id="home-screen">
			<h1 class="logo">Saint Vicious</h1>
			<form id="search-form" class="search">
				<input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL" aria-label="Search or enter a URL" autofocus />
			</form>
			<p id="status" class="status" role="status">Starting proxy…</p>
			<!-- Brand icons from Simple Icons (CC0), https://simpleicons.org -->
			<nav id="shortcuts" class="shortcuts" aria-label="Shortcuts">
				<button class="shortcut" type="button" data-url="https://www.youtube.com/" title="YouTube">
					<span class="shortcut-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" /></svg></span>
					<span class="shortcut-label">YouTube</span>
				</button>
				<button class="shortcut" type="button" data-url="https://www.tiktok.com/" title="TikTok">
					<span class="shortcut-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" /></svg></span>
					<span class="shortcut-label">TikTok</span>
				</button>
				<button class="shortcut" type="button" data-url="https://discord.com/app" title="Discord">
					<span class="shortcut-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#5865F2" d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" /></svg></span>
					<span class="shortcut-label">Discord</span>
				</button>
				<button class="shortcut" type="button" data-url="https://www.twitch.tv/" title="Twitch">
					<span class="shortcut-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#9146FF" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z" /></svg></span>
					<span class="shortcut-label">Twitch</span>
				</button>
			</nav>
		</main>

		<div id="frames"></div>

		<dialog id="settings-panel" class="panel" aria-labelledby="settings-title">
			<header class="panel-head">
				<h2 id="settings-title">Settings</h2>
				<button id="settings-close" class="icon" type="button" title="Close" aria-label="Close">
					<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
				</button>
			</header>
			<div class="settings">
				<label>
					Transport
					<select id="transport">
						<option value="libcurl">libcurl</option>
						<option value="epoxy">epoxy</option>
					</select>
				</label>
				<label>
					Wisp server
					<input id="wisp" type="url" autocomplete="off" spellcheck="false" />
				</label>
				<label>
					Save history
					<input id="save-history" type="checkbox" />
				</label>
				<label>
					Search engine
					<select id="engine">
						<option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
						<option value="https://www.google.com/search?q=%s">Google</option>
						<option value="https://www.bing.com/search?q=%s">Bing</option>
						<option value="https://search.brave.com/search?q=%s">Brave</option>
					</select>
				</label>
				<p id="settings-status" class="status" role="status"></p>
			</div>
		</dialog>

		<dialog id="history-panel" class="panel" aria-labelledby="history-title">
			<header class="panel-head history-head">
				<h2 id="history-title">History</h2>
				<input id="history-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search history" aria-label="Search history" />
				<button id="history-clear" class="text-button" type="button">Clear all</button>
				<button id="history-close" class="icon" type="button" title="Close" aria-label="Close">
					<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
				</button>
			</header>
			<div id="history-list"></div>
		</dialog>
	</body>
</html>
