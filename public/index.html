<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#120d1d" />
		<title>WX</title>
		<link rel="icon" href="favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="stylesheet" href="style.css" />
		<script src="ugs-files.js" defer></script>
		<script src="gn-files.js" defer></script>
		<script src="wx.js" defer></script>
	</head>
	<body>
		<nav class="side" aria-label="Sections">
			<a class="side-logo" href="./" title="WX"><img src="apple-touch-icon.png" alt="WX" /></a>
			<button class="side-btn active" type="button" data-view="all" title="Games" aria-label="Games">
				<svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-3.96 3.43l-.9 6.32a2.5 2.5 0 0 0 4.5 1.85L8 15h8l1.66 1.6a2.5 2.5 0 0 0 4.5-1.85l-.9-6.32A4 4 0 0 0 17.3 5z" /></svg>
			</button>
			<button class="side-btn" type="button" data-view="favorites" title="Favorites" aria-label="Favorites">
				<svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z" /></svg>
			</button>
			<button class="side-btn" type="button" data-view="recent" title="Recently played" aria-label="Recently played">
				<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3" /></svg>
			</button>
		</nav>

		<div class="main">
			<header class="top">
				<h1 id="title" class="title">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-3.96 3.43l-.9 6.32a2.5 2.5 0 0 0 4.5 1.85L8 15h8l1.66 1.6a2.5 2.5 0 0 0 4.5-1.85l-.9-6.32A4 4 0 0 0 17.3 5z" /></svg>
					<span id="title-text">Games</span>
				</h1>
				<input id="search" class="search" type="search" placeholder="Search…" aria-label="Search games" autocomplete="off" spellcheck="false" />
			</header>

			<div class="chips" role="tablist" aria-label="Collections">
				<button class="chip active" type="button" role="tab" data-source="all">All <span class="chip-n"></span></button>
				<button class="chip" type="button" role="tab" data-source="gn">Gn-Math <span class="chip-n"></span></button>
				<button class="chip" type="button" role="tab" data-source="ugs">UGS <span class="chip-n"></span></button>
			</div>

			<main id="grid" class="grid" aria-label="Games"></main>
			<p id="empty" class="empty" hidden></p>
		</div>
	</body>
</html>
