# One-click deploy on Render (render.com): New -> Blueprint -> pick this repo.
# Runs the full Skyline server (proxy, AdGuard DNS, Wisp and AI). Render asks for
# GEMINI_API_KEY when you create it; the key stays in Render, never in the repo.
services:
  - type: web
    name: skyline
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: AI_COOKIE_SECRET
        generateValue: true
      # Lets the GitHub Pages copy of Skyline use this server's AI.
      - key: AI_ALLOWED_ORIGINS
        value: https://nyxosdev760.github.io
